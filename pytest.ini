[pytest]
testpaths = tests
# Tests import `models`, `loss` and `pointnet2_ops_lib` from the repository root.
pythonpath = .
markers =
    cuda: needs a CUDA GPU with mamba_ssm and pointnet2_ops (gate G2)
    clip: needs CLIP weights (gate G3)
    data: needs preprocessed S3DIS/ScanNet blocks (gate G4)
